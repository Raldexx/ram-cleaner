<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAM Cleaner</title>
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <main class="container">
      <h1>RAM Cleaner</h1>

      <section class="ram-summary">
        <div class="ram-bar">
          <div id="ram-bar-fill" class="ram-bar-fill"></div>
        </div>
        <p id="ram-text">Loading...</p>
      </section>

      <div class="actions">
        <button id="clean-btn">Clean</button>
        <button id="refresh-btn">Refresh</button>
      </div>

      <p id="clean-result"></p>

      <table id="process-table">
        <thead>
          <tr>
            <th>PID</th>
            <th>Name</th>
            <th>RAM (MB)</th>
            <th></th>
          </tr>
        </thead>
        <tbody id="process-tbody"></tbody>
      </table>
    </main>
  </body>
</html>
