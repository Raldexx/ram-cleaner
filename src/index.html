<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RAM Cleaner</title>
    <!-- Apply the saved theme before first paint so the window never flashes the wrong colors -->
    <script>
      try {
        const t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
    <link rel="stylesheet" href="styles.css" />
    <script type="module" src="/main.js" defer></script>
  </head>

  <body>
    <div class="bg-glow" aria-hidden="true"></div>

    <main class="app">
      <!-- ============ Top bar ============ -->
      <header class="topbar">
        <div class="brand">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <rect x="6" y="6" width="12" height="12" rx="2.5" />
              <path d="M9 2.5v3.5M15 2.5v3.5M9 18v3.5M15 18v3.5M2.5 9H6M2.5 15H6M18 9h3.5M18 15h3.5" />
              <path d="M9.5 12h5" />
            </svg>
          </span>
          <h1>RAM Cleaner</h1>
        </div>

        <button id="theme-btn" class="icon-btn" type="button" data-mode="auto" aria-label="Change theme" title="Theme: Auto">
          <svg class="i-auto" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5" /><path d="M12 3.5v17" /><path d="M12 3.5a8.5 8.5 0 0 1 0 17z" fill="currentColor" stroke="none" /></svg>
          <svg class="i-light" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4" /><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M5.3 18.7l1.4-1.4M17.3 6.7l1.4-1.4" /></svg>
          <svg class="i-dark" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 0 1 9.5 4a8.5 8.5 0 1 0 10.5 10.5z" /></svg>
        </button>
      </header>

      <!-- ============ Hero: big RAM gauge ============ -->
      <section class="card hero" style="--i: 0">
        <div class="gauge" id="gauge">
          <svg viewBox="0 0 120 120" aria-hidden="true">
            <circle class="gauge-track" cx="60" cy="60" r="52" />
            <circle class="gauge-fill" id="gauge-fill" cx="60" cy="60" r="52" />
          </svg>
          <div class="gauge-center">
            <div class="gauge-value"><span id="gauge-percent">0</span><span class="gauge-pct">%</span></div>
            <small>RAM in use</small>
          </div>
        </div>

        <div class="hero-side">
          <div class="stats">
            <div class="stat"><small>Used</small><strong id="stat-used">-</strong></div>
            <div class="stat"><small>Available</small><strong id="stat-free">-</strong></div>
            <div class="stat"><small>Total</small><strong id="stat-total">-</strong></div>
          </div>

          <div class="actions">
            <button id="clean-btn" class="btn primary big" type="button">Clean now</button>
            <button id="refresh-btn" class="btn ghost" type="button">Refresh</button>
          </div>
          <p id="clean-result" aria-live="polite"></p>
        </div>
      </section>

      <div class="columns">
        <!-- ============ Running apps ============ -->
        <section class="card apps-card" style="--i: 1">
          <div class="card-head">
            <h2>Running apps <span class="count" id="apps-count"></span></h2>
            <div class="sort" id="sort-group">
              <button type="button" data-sort="memory_mb" class="sort-btn active" data-dir="desc">Memory</button>
              <button type="button" data-sort="name" class="sort-btn">Name</button>
            </div>
          </div>

          <label class="search">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="6.5" /><path d="M20 20l-4.2-4.2" /></svg>
            <input id="filter-input" type="text" placeholder="Search apps..." autocomplete="off" />
          </label>

          <div id="app-list" class="app-list"></div>
          <p id="apps-empty" class="empty" hidden>No apps match your search.</p>
        </section>

        <!-- ============ Right column ============ -->
        <div class="side">
          <section class="card protect-card" style="--i: 2">
            <div class="card-head"><h2>Protection</h2></div>

            <div class="tabs" id="list-tabs" role="tablist">
              <button type="button" class="tab active" role="tab" data-list="whitelist">Whitelist <span class="tab-count">0</span></button>
              <button type="button" class="tab" role="tab" data-list="blacklist">Blacklist <span class="tab-count">0</span></button>
              <button type="button" class="tab" role="tab" data-list="guard_list">Critical <span class="tab-count">0</span></button>
            </div>

            <p class="hint" id="list-hint"></p>

            <div class="list-add">
              <input id="list-input" type="text" placeholder="Search a running app to add..." autocomplete="off" />
              <button id="list-add-btn" class="btn ghost" type="button">Add</button>
              <div class="suggestions" id="list-suggestions" hidden></div>
            </div>

            <div class="quick-add" id="quick-add" hidden>
              <small>Quick add</small>
              <div class="quick-chips" id="quick-chips"></div>
            </div>

            <div class="list-items" id="list-items"></div>

            <div class="mode-row">
              <span>Clean mode</span>
              <div class="segmented">
                <label><input type="radio" name="clean-mode" value="all" /><span>Everything</span></label>
                <label><input type="radio" name="clean-mode" value="blacklist_only" /><span>Blacklist only</span></label>
              </div>
            </div>
            <p class="hint small" id="mode-hint"></p>
          </section>

          <section class="card auto-card" style="--i: 3">
            <div class="card-head">
              <h2>Automation</h2>
            </div>

            <div class="row">
              <div class="row-text"><strong>Auto clean</strong><small>Clean in the background, even from the tray</small></div>
              <label class="switch"><input type="checkbox" id="auto-enabled" /><span></span></label>
            </div>

            <div class="auto-body" id="auto-body">
              <div class="segmented wide">
                <label><input type="radio" name="auto-trigger" value="interval" /><span>On a schedule</span></label>
                <label><input type="radio" name="auto-trigger" value="threshold" /><span>When RAM is high</span></label>
              </div>
              <div class="value-row" id="interval-row">
                <span>Every</span>
                <input type="number" id="interval-minutes" min="1" max="1440" />
                <span>minutes</span>
              </div>
              <div class="value-row" id="threshold-row">
                <span>When usage passes</span>
                <input type="number" id="threshold-percent" min="50" max="99" />
                <span>%</span>
              </div>
            </div>

            <div class="divider"></div>

            <div class="row">
              <div class="row-text"><strong>Start with Windows</strong></div>
              <label class="switch"><input type="checkbox" id="autostart-enabled" /><span></span></label>
            </div>
            <div class="row">
              <div class="row-text"><strong>Welcome tour</strong></div>
              <button id="tour-btn" class="btn ghost small" type="button">Replay</button>
            </div>
          </section>
        </div>
      </div>
    </main>

    <!-- One reusable dialog: confirmations and the first-run welcome tour -->
    <dialog id="app-dialog">
      <h2 id="dialog-title"></h2>
      <small id="dialog-step" class="dialog-step" hidden></small>
      <div id="dialog-body"></div>
      <div class="dialog-actions">
        <button id="dialog-secondary" class="btn ghost" type="button" hidden></button>
        <button id="dialog-primary" class="btn primary" type="button"></button>
      </div>
    </dialog>
  </body>
</html>
