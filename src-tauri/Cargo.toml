[package]
name = "ram-cleaner"
version = "0.1.0"
description = "Frees RAM on Windows by trimming the memory background apps hold on to"
authors = ["Raldex"]
edition = "2021"

[lib]
# The `_lib` suffix keeps the library name from clashing with the binary name (a Windows-only issue).
name = "ram_cleaner_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Storage_FileSystem",
    "Win32_System_ProcessStatus",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
